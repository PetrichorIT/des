entry: A
modules:
  A:
    submodules:
      bob[2]: Bob
  Bob:
    gates:
      - down
    submodules:
      child: Alice
    connections:
      - peers:
          - down
          - child/up
        link: FastLink
  Alice:
    gates:
      - up
links:
  FastLink:
    latency: 0.05
    jitter: 0.01
    bitrate: 10000
